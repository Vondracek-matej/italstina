<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Italština">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikona-180.png">
<link rel="icon" href="ikona-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Matějova italština</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Rozvržení: aplikace pro iPhone ve stylu Apple „Liquid Glass“ – velké nadpisy, skleněné karty na tapetě v barvách italské trikolóry,
   plovoucí spodní lišta s 5 záložkami (Dnes, Témata, Kartičky, Rozhovor, Pokrok). */
:root{
  --fg:#0b0d10; --fg2:#3c3c43; --muted:#7a7f87; --line:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12);
  --accent:#0a8f4e; --accent-soft:rgba(10,143,78,.13); --ok:#1f9d55; --ok-soft:rgba(52,199,89,.16);
  --bad:#e5383b; --bad-soft:rgba(255,59,48,.12); --warn:#e07b00; --warn-soft:rgba(255,149,0,.15);
  --glass:rgba(255,255,255,.76); --gline:rgba(255,255,255,.85); --solid:#ffffff;
  --edge:rgba(255,255,255,.95); --lift:0 1px 2px rgba(20,40,30,.05),0 10px 30px rgba(20,40,30,.08);
  --tabglass:rgba(255,255,255,.8); --tabsh:0 14px 40px rgba(20,40,30,.18); --gloss:rgba(255,255,255,.24); --wglow:rgba(255,255,255,.8);
  --wt0:#eef7f1; --wt1:#fff3f3; --wa1:#a8e6bf; --wb1:#5fcf8c; --wa2:#ffffff; --wb2:#f4f6f5; --wa3:#ffb3b8; --wb3:#ff6f7a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,"Segoe UI",Roboto,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,"Segoe UI",Roboto,sans-serif;
  --r:18px; --rl:28px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fg:#f5f7f6; --fg2:#e2e6e4; --muted:#949a98; --line:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
  --accent:#30d158; --accent-soft:rgba(48,209,88,.2); --ok:#30d158; --ok-soft:rgba(48,209,88,.18);
  --bad:#ff453a; --bad-soft:rgba(255,69,58,.18); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18);
  --glass:rgba(32,36,34,.72); --gline:rgba(255,255,255,.08); --solid:#1c1f1e;
  --edge:rgba(255,255,255,.12); --lift:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.32);
  --tabglass:rgba(32,36,34,.84); --tabsh:0 14px 40px rgba(0,0,0,.5); --gloss:rgba(255,255,255,.14); --wglow:rgba(0,0,0,.55);
  --wt0:#06100b; --wt1:#140709; --wa1:#0f5a33; --wb1:#0a7a42; --wa2:#2a302d; --wb2:#1c201e; --wa3:#7a1a22; --wb3:#a0222d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --fg:#f5f7f6; --fg2:#e2e6e4; --muted:#949a98; --line:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
  --accent:#30d158; --accent-soft:rgba(48,209,88,.2); --ok:#30d158; --ok-soft:rgba(48,209,88,.18);
  --bad:#ff453a; --bad-soft:rgba(255,69,58,.18); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18);
  --glass:rgba(32,36,34,.72); --gline:rgba(255,255,255,.08); --solid:#1c1f1e;
  --edge:rgba(255,255,255,.12); --lift:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.32);
  --tabglass:rgba(32,36,34,.84); --tabsh:0 14px 40px rgba(0,0,0,.5); --gloss:rgba(255,255,255,.14); --wglow:rgba(0,0,0,.55);
  --wt0:#06100b; --wt1:#140709; --wa1:#0f5a33; --wb1:#0a7a42; --wa2:#2a302d; --wb2:#1c201e; --wa3:#7a1a22; --wb3:#a0222d;
  color-scheme:dark}

html,body{background:var(--wt0)}
#wall{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--wt0);overflow:hidden}
#wall svg{position:absolute;inset:0;width:100%;height:100%;display:block}
body{color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.4;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 44px)}
#app{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.12}
h2{font-size:26px;font-weight:700;line-height:1.15}
h3{font-size:21px;font-weight:700}
p{margin:0}
button,a,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button,a{cursor:pointer}
a{text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.top h1,.top .eyebrow,.sec-h h3,.cap,.foot,.backbtn{text-shadow:0 1px 10px var(--wglow)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.sec-h button{border:0;background:none;color:var(--accent);font-size:16px;font-weight:600;padding:0}
.cap{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:0 16px}
.foot{font-size:13px;color:var(--muted);padding:0 16px;line-height:1.45}

.glass,.list,.box,.tile,.kpi,.qcard,.result,.step,.ccard{background:var(--glass);box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 .5px var(--gline),var(--lift)}
.list{border-radius:var(--r);overflow:hidden}
.box{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;background:none;width:100%;box-sizing:border-box;text-align:left;position:relative;min-height:58px;transition:background .15s}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
button.row:active{background:var(--fill)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t b{font-weight:600}
.row .t span{font-size:14px;color:var(--muted)}
.row .t i{font-style:normal;font-size:13px;color:var(--accent);font-weight:500}
.chev{width:8px;height:14px;flex:none;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.6}

.sq{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.sq svg{width:58%;height:58%;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap;flex:none}
.p-nove{background:var(--fill);color:var(--muted)} .p-ucim{background:var(--warn-soft);color:var(--warn)} .p-umim{background:var(--ok-soft);color:var(--ok)}

.btn{border:0;border-radius:99px;padding:13px 22px;font-size:17px;font-weight:600;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;transition:transform .12s,opacity .12s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px -6px var(--accent)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.tint{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.gray{background:var(--fill);color:var(--fg);box-shadow:none}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:7px 16px;font-size:15px}
.pillbtn{border:0;border-radius:99px;padding:9px 18px;font-size:15px;font-weight:700;background:#fff;color:#0b0d10;display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
.pillbtn:active{transform:scale(.95)}
.spk{border:0;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;transition:transform .12s}
.spk:active{transform:scale(.92)}
.spk svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk.on{background:var(--accent);color:#fff}
.spk.big{width:52px;height:52px}
.spk.big svg{width:26px;height:26px}
.nospk .spk{display:none}

/* barevné karty */
.feat,.mini,.lhero,.remember{position:relative;overflow:hidden;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 34px -10px rgba(20,40,30,.4)}
.feat::before,.mini::before,.lhero::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,var(--gloss),transparent 45%)}
.feat{border-radius:var(--rl);padding:20px;display:flex;flex-direction:column;gap:6px;min-height:210px;justify-content:flex-end}
.feat .eb,.mini .eb{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.88;position:absolute;top:18px;left:20px;right:20px}
.feat h2{color:#fff;font-size:29px;position:relative}
.feat p{opacity:.92;font-size:15px;position:relative}
.feat .acts{display:flex;gap:8px;margin-top:10px;position:relative;flex-wrap:wrap}
.bigsym{position:absolute;pointer-events:none;opacity:.2;right:-26px;top:-12px;width:180px;height:180px}
.bigsym svg{width:100%;height:100%;stroke:#fff;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,62%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;padding-bottom:8px}
.shelf::-webkit-scrollbar{display:none}
.mini{border:0;text-align:left;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:4px;justify-content:flex-end;min-height:140px;scroll-snap-align:start;transition:transform .12s}
.mini:active{transform:scale(.97)}
.mini .eb{top:14px;left:16px}
.mini b{font-family:var(--font-d);font-size:19px;font-weight:700;line-height:1.2;position:relative;text-wrap:balance}
.mini span{font-size:13px;opacity:.92;position:relative}
.mini .bigsym{width:100px;height:100px;right:-14px;top:-6px}

/* dnešní cíl */
.goalcard{border-radius:var(--rl);padding:18px 20px;display:flex;align-items:center;gap:20px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--font-d);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.ring .v small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.goalcard .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.goalcard .t b{font-family:var(--font-d);font-size:20px}
.goalcard .t span{font-size:15px;color:var(--muted)}
.phrase{border-radius:var(--rl);padding:18px 20px;display:flex;gap:14px;align-items:center}
.phrase .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.phrase .t b{font-family:var(--font-d);font-size:22px;font-weight:700;line-height:1.25}
.phrase .t span{color:var(--muted);font-size:15px}
.phrase .t i{font-style:normal;color:var(--accent);font-size:14px;font-weight:500}

/* témata */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:0;text-align:left;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .tt{display:flex;flex-direction:column;gap:1px}
.tile b{font-weight:600;line-height:1.25}
.tile span{font-size:13px;color:var(--muted)}
.mbar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* detail tématu */
.backbtn{border:0;background:none;color:var(--accent);font-size:17px;padding:4px 0;align-self:flex-start;display:flex;align-items:center;gap:4px;margin-bottom:-8px}
.backbtn svg{width:11px;height:19px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lhero{border-radius:var(--rl);padding:22px 20px;display:flex;flex-direction:column;gap:6px;min-height:180px;justify-content:flex-end}
.lhero .eb{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.9;position:relative}
.lhero h2{color:#fff;position:relative}
.lhero p{position:relative;opacity:.92;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border-radius:99px;padding:3px;gap:3px;background:var(--glass);box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 .5px var(--gline)}
.seg button{border:0;background:none;border-radius:99px;padding:8px 4px;font-size:15px;font-weight:500;color:var(--fg)}
.seg button.on{background:var(--solid);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.14),inset 0 1px 0 var(--edge)}
.step{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.sthead{display:flex;gap:12px;align-items:center}
.sthead i{width:28px;height:28px;border-radius:50%;color:#fff;font-style:normal;font-weight:700;font-size:15px;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.sthead b{font-family:var(--font-d);font-weight:600;font-size:19px;line-height:1.25}
.step p{line-height:1.5}
.ex{background:var(--accent-soft);border-radius:14px;padding:10px 12px 10px 14px;display:flex;gap:10px;align-items:center}
.ex .t{flex:1;min-width:0;display:flex;flex-direction:column}
.ex .t b{font-weight:600}
.ex .t span{font-size:15px;color:var(--fg2)}
.ex .spk{width:32px;height:32px;background:var(--solid)}

/* kartičky */
.prog{display:flex;flex-direction:column;gap:8px}
.prog .pt{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.03em}
.ccard{border-radius:var(--rl);padding:26px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;min-height:220px;justify-content:center}
.ccard .fl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ccard .q{font-family:var(--font-d);font-size:28px;font-weight:700;line-height:1.25;text-wrap:balance}
.ccard .pr{font-size:15px;color:var(--accent);font-weight:500}
.kin{width:100%;font-family:var(--font-d);font-size:21px;font-weight:600;color:var(--fg);background:var(--solid);border:0;border-radius:20px;padding:14px 16px;box-shadow:inset 0 0 0 1.5px var(--line);outline:none;text-align:center}
.kin:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.verdict{border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center;animation:pop .3s}
.verdict.ok{background:var(--ok-soft)} .verdict.skoro{background:var(--warn-soft)} .verdict.bad{background:var(--bad-soft);animation:shake .3s}
.verdict .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.verdict .t b{font-weight:700}
.verdict.ok .t b{color:var(--ok)} .verdict.skoro .t b{color:var(--warn)} .verdict.bad .t b{color:var(--bad)}
.verdict .t span{font-size:16px}
.verdict .t i{font-style:normal;font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-size:15px;font-weight:600;padding:4px 0;align-self:center}

/* kvíz */
.qcard{border-radius:var(--rl);padding:22px 20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.qcard p{font-family:var(--font-d);font-size:24px;font-weight:700;line-height:1.3;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:0;background:var(--glass);border-radius:20px;padding:14px 16px;text-align:left;font-size:17px;display:flex;gap:12px;align-items:center;transition:transform .12s;
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 .5px var(--gline),var(--lift)}
.opt:active{transform:scale(.98)}
.opt .k{width:28px;height:28px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.opt.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok);animation:pop .35s} .opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad);animation:shake .3s} .opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.result{border-radius:var(--rl);padding:26px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.result .ring{width:140px;height:140px}
.result .ring .v{font-size:34px}

/* rozhovor */
.scen{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:4px}
.scen::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:99px;padding:8px 15px;font-size:15px;font-weight:500;white-space:nowrap;background:var(--glass);box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 .5px var(--gline)}
.chip.on{background:var(--fg);color:var(--wt0);font-weight:600}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 15px;border-radius:20px;font-size:17px;line-height:1.45;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--glass);border-bottom-left-radius:6px;box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 .5px var(--gline);display:flex;flex-direction:column;gap:6px}
.msg.ai .it{display:flex;gap:10px;align-items:flex-start}
.msg.ai .it b{flex:1;font-weight:600}
.msg.ai .it .spk{width:30px;height:30px;margin-top:-2px}
.msg.ai .it .spk svg{width:16px;height:16px}
.msg.ai .cz{font-size:15px;color:var(--muted)}
.msg.ai .fix{font-size:15px;border-radius:12px;padding:8px 11px;background:var(--warn-soft)}
.msg.ai .fix.good{background:var(--ok-soft)}
.msg.ai .raw{white-space:pre-wrap}
.who{display:flex;align-items:center;gap:12px}
.who .t{display:flex;flex-direction:column}
.who .t b{font-family:var(--font-d);font-size:19px}
.who .t span{font-size:14px;color:var(--muted)}
.navrhy{display:flex;flex-wrap:wrap;gap:8px}
.navrhy .chip{white-space:normal;text-align:left;font-size:14px}
.composer{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:8px;align-items:flex-end;background:var(--solid);border-radius:28px;padding:6px 6px 6px 16px;z-index:5;
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 .5px var(--gline),var(--tabsh)}
.composer textarea{flex:1;border:0;background:none;resize:none;color:var(--fg);padding:8px 0;max-height:140px;outline:none;font-size:17px}

:root[data-theme="dark"]{--glass:rgba(28,32,30,.58); --gline:rgba(255,255,255,.08)}

/* Kontrola napsané odpovědi. Vrací "ok", "skoro" (chybí přízvuk, člen nebo jeden překlep) nebo "spatne". */
function zkontroluj(vstup, spravne, jazyk){
  const x = norm(vstup); if (!x) return { v:"spatne" };
  let nej = { v:"spatne" };
  for (const s of spravne.split("|")){
    const a = norm(bezPozn(s)); if (!a) continue;
    if (x === a) return { v:"ok" };
    if (bezDiakr(x) === bezDiakr(a)){ if (jazyk === "cz") return { v:"ok" }; nej = { v:"skoro", proc:"Pozor na přízvuk: " + bezPozn(s) }; continue; }
    if (jazyk === "it"){
      const xc = x.replace(CLENY, ""), ac = a.replace(CLENY, "");
      if (xc !== x || ac !== a){ if (bezDiakr(xc) === bezDiakr(ac)){ if (nej.v !== "skoro") nej = { v:"skoro", proc:"Nezapomeň na člen: " + bezPozn(s) }; continue; } }
    }
    const d = lev(bezDiakr(x), bezDiakr(a));
    if (d <= 1 && a.length >= 4 && nej.v !== "skoro") nej = { v:"skoro", proc:"Malý překlep. Správně: " + bezPozn(s) };
  }
  return nej;
}

function mluvP(text, rate){

  return new Promise(res => {
    if (!t || S.test) return res(false);
    if (tts && !ttsZakazane){
      tts.speak(t, { language:"it", rate:rate || .9 }).then(() => res(true), e => {
        if (e && (e.code === "not_granted" || e.code === "unavailable")){ ttsZakazane = true; document.body.classList.add("nospk"); }
        res(false);
      });
      return;
    }
    if (!tts && window.speechSynthesis){
      /* 23. 11.: oprava sekání na iPhonu – nemluvit hned po cancel(), držet si odkaz na větu, vybrat nejlepší italský hlas */
      try {
        const ss = window.speechSynthesis; if (!HLAS_IT) nactiHlas();
        let hotovo = false; const konec = ok => { if (!hotovo){ hotovo = true; res(ok); } };
        const start = () => {
          const u = new SpeechSynthesisUtterance(t); u.lang = HLAS_IT ? HLAS_IT.lang : "it-IT"; u.rate = rate || .92; u.pitch = 1; u.volume = 1;
          if (HLAS_IT) u.voice = HLAS_IT;
          window._mluvenaVeta = u;   /* jinak ji Safari někdy zahodí a utne v půlce */
          u.onend = () => konec(true); u.onerror = () => konec(false);
          ss.speak(u); if (ss.paused) ss.resume();
          setTimeout(() => konec(true), 2500 + t.length * 150);   /* pojistka, kdyby onend nepřišlo */
        };
        if (ss.speaking || ss.pending){ ss.cancel(); setTimeout(start, 220); } else start();
      } catch (e) { res(false); }
      return;
    }
    res(false);
  });
}

  const ids = [...new Set(tezke.concat(due, tyden))].slice(0, 25);
  S.karty = { ids:mix(ids), i:0, tema:null, odp:null, dobre:0, spatne:[], vstup:"", bonus:true };
}
async function poslechni(){

function novyKviz(k){
  const ids = TM[k].slova.map((_, i) => k + "-" + i);

    const typ = n % 2 ? "czit" : "itcz";

function vyberKviz(id){

}

/* 23. 11.: když se aplikace v Claude obnoví na novou verzi, pokračuje se tam, kde Matěj byl (i uprostřed lekce, kartiček nebo kvízu) */

    dikt.onState(({ state , reason }) => { logMic({ co:"stav", state, reason });  if (state === "idle" && S.lx && S.lx.mluv.stav === "posloucham"){ S.lx.mluv.stav = "vyhodnocuji"; lxVyhodnot(); return; } const h = H(); if (state === "idle" && h && h.stav === "posloucham"){ h.stav = "zpracuju"; renderCall(); odesliHovor(); } });

<script>
/* Jako na iPhonu: táhni prstem doprava a vrátíš se o krok zpátky (stejně jako tlačítko Zpět). */
(() => {
  let x0 = null, y0 = 0, t0 = 0, tah = false;
  const app = () => document.getElementById("app");
  const zpet = () => document.querySelector("#app .backbtn");
  const vynech = el => el && el.closest("input,textarea,.shelf,.chips,.scen,.seg,.pairs,.bank,.ans,.kr,.composer");
  addEventListener("touchstart", e => {
    x0 = null; tah = false;
    if (e.touches.length !== 1 || !zpet() || vynech(e.target)) return;
    const t = e.touches[0]; if (t.clientX > innerWidth * .6) return;
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
  }, { passive:true });
  addEventListener("touchmove", e => {
    if (x0 == null) return;
    const t = e.touches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0);
    if (!tah){ if (dy > 18 && dy > dx){ x0 = null; return; } if (dx > 14 && dx > dy * 1.5) tah = true; else return; }
    const a = app(); a.style.transition = "none"; a.style.transform = "translateX(" + Math.max(0, dx) + "px)"; a.style.opacity = String(1 - Math.min(Math.max(dx, 0) / innerWidth, .5));
  }, { passive:true });
  addEventListener("touchend", e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, a = app(), rychle = Date.now() - t0 < 300;
    x0 = null; if (!tah) return; tah = false;
    a.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1), opacity .22s";
    if (dx > innerWidth * .3 || (rychle && dx > 60)){
      a.style.transform = "translateX(" + innerWidth + "px)"; a.style.opacity = "0";
      setTimeout(() => { const b = zpet(); a.style.transition = "none"; a.style.transform = ""; a.style.opacity = ""; if (b) b.click(); }, 200);
    } else { a.style.transform = ""; a.style.opacity = ""; }
  });
})();
</script>
